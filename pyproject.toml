[project]
name = "mlrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "niharingle30", email = "ingalenihar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "jq>=1.12.0",
    "langchain>=1.3.15",
    "langchain-astradb>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "unstructured[docx]>=0.25.2",
]

[project.scripts]
mlrag = "mlrag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
